    <li><span class="inline-icon"></span> mutes a part, <b>S</b> plays it alone</li>
  </ol>
</div>



</div>

<script>
/* ============================================================
   Choir Looper
   Several audio files play together on one Web Audio clock, so
   the parts stay locked to each other. Loop region, speed, and
   per-track volume / mute / solo apply to everything at once.
   ============================================================ */

// ===== CHAOS KITTEN ENGINE (Anime Style) =====
const chaosCanvas = document.getElementById('sceneCanvas');
const cctx = chaosCanvas.getContext('2d');
let chaosRunning = false;
const kittens = [];
const kaijus = [];
const buildings = [];
const trees = [];
const particles = [];
const lasers = [];

const KITTEN_COLORS = ['#ff66cc','#66ffff','#ffff66','#ff6666','#66ff99','#cc99ff','#ff9966'];
const KAIJU_COLORS = ['#880044','#440088','#004488'];
const POWER_COLORS = ['#ff0','#0ff','#f0f','#ff4400','#00ff88','#fff'];

function resizeChaos() {
  chaosCanvas.width = window.innerWidth;
  chaosCanvas.height = window.innerHeight;
}

// Draw anime-style kitten (full body, flying pose)
function drawKitten(k) {
  const c = cctx;
  const s = k.size;
  const flip = k.vx < 0 ? -1 : 1;
  c.save();
  c.translate(k.x, k.y);
  // hop up and pop bigger on the beat
  const pop = 1 + (k.hop || 0) * 0.35;
  c.translate(0, -(k.hop || 0) * s * 0.5);
  c.scale(flip * pop, pop);

  // Cape / trail
  c.fillStyle = k.capeColor;
  c.globalAlpha = 0.5;
  c.beginPath();
  c.moveTo(-s*0.2, -s*0.1);
  c.quadraticCurveTo(-s*0.8 - Math.sin(k.wobble)*s*0.3, s*0.3, -s*0.5, s*0.7);
  c.quadraticCurveTo(-s*0.1, s*0.5, 0, s*0.1);
  c.fill();
  c.globalAlpha = 1;

  // Body (oval)
  c.fillStyle = k.color;
  c.beginPath();
  c.ellipse(0, 0, s*0.25, s*0.35, 0, 0, Math.PI*2);
  c.fill();
  c.strokeStyle = '#000'; c.lineWidth = 1.5;
  c.stroke();

  // Head
  c.fillStyle = k.color;
  c.beginPath();
  c.arc(0, -s*0.4, s*0.22, 0, Math.PI*2);
  c.fill(); c.stroke();

  // Ears (triangles)
  c.fillStyle = k.color;
  c.beginPath();
  c.moveTo(-s*0.15, -s*0.55); c.lineTo(-s*0.08, -s*0.75); c.lineTo(-s*0.02, -s*0.55);
  c.fill(); c.stroke();
  c.beginPath();
  c.moveTo(s*0.02, -s*0.55); c.lineTo(s*0.08, -s*0.75); c.lineTo(s*0.15, -s*0.55);
  c.fill(); c.stroke();
  // Inner ears
  c.fillStyle = '#ffaacc';
  c.beginPath();
  c.moveTo(-s*0.12, -s*0.56); c.lineTo(-s*0.08, -s*0.68); c.lineTo(-s*0.04, -s*0.56); c.fill();
  c.beginPath();
  c.moveTo(s*0.04, -s*0.56); c.lineTo(s*0.08, -s*0.68); c.lineTo(s*0.12, -s*0.56); c.fill();

  // Eyes (big anime eyes)
  const eyeGlow = k.power === 'laser';
  c.fillStyle = eyeGlow ? '#ff0000' : '#fff';
  c.beginPath(); c.ellipse(-s*0.08, -s*0.42, s*0.06, s*0.07, 0, 0, Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(s*0.08, -s*0.42, s*0.06, s*0.07, 0, 0, Math.PI*2); c.fill();
  if(!eyeGlow) {
    c.fillStyle = k.eyeColor;
    c.beginPath(); c.arc(-s*0.08, -s*0.41, s*0.035, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(s*0.08, -s*0.41, s*0.035, 0, Math.PI*2); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(-s*0.06, -s*0.43, s*0.015, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(s*0.1, -s*0.43, s*0.015, 0, Math.PI*2); c.fill();
  }

  // Mouth
  c.strokeStyle = '#333'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(-s*0.04,-s*0.33); c.lineTo(0,-s*0.3); c.lineTo(s*0.04,-s*0.33); c.stroke();

  // Arms (outstretched, flying)
  c.strokeStyle = '#000'; c.lineWidth = 2;
  c.fillStyle = k.color;
  // Left arm
  c.beginPath(); c.moveTo(-s*0.2, -s*0.1); c.lineTo(-s*0.4, -s*0.25); c.lineTo(-s*0.38, -s*0.15); c.fill(); c.stroke();
  // Right arm (holding weapon if applicable)
  c.beginPath(); c.moveTo(s*0.2, -s*0.1); c.lineTo(s*0.4, -s*0.25); c.lineTo(s*0.38, -s*0.15); c.fill(); c.stroke();

  // Light sword
  if(k.power === 'sword') {
    const swordHue = (k.wobble * 50) % 360;
    c.strokeStyle = `hsl(${swordHue},100%,70%)`;
    c.lineWidth = 3; c.shadowColor = `hsl(${swordHue},100%,60%)`; c.shadowBlur = 10;
    c.beginPath(); c.moveTo(s*0.4,-s*0.25); c.lineTo(s*0.7,-s*0.55); c.stroke();
    c.shadowBlur = 0;
  }

  // Claws (if claw power)
  if(k.power === 'claw') {
    c.strokeStyle = '#fff'; c.lineWidth = 2;
    c.shadowColor = '#ff0'; c.shadowBlur = 6;
    for(let i = 0; i < 3; i++) {
      c.beginPath();
      c.moveTo(s*0.35, -s*0.3 + i*s*0.06);
      c.lineTo(s*0.55, -s*0.35 + i*s*0.06);
      c.stroke();
    }
    c.shadowBlur = 0;
  }

  // Legs (dangling)
  c.fillStyle = k.color; c.strokeStyle = '#000'; c.lineWidth = 1.5;
  c.beginPath();
  c.ellipse(-s*0.1, s*0.3, s*0.07, s*0.12, Math.sin(k.wobble)*0.3, 0, Math.PI*2);
  c.fill(); c.stroke();
  c.beginPath();
  c.ellipse(s*0.1, s*0.3, s*0.07, s*0.12, -Math.sin(k.wobble)*0.3, 0, Math.PI*2);
  c.fill(); c.stroke();

  // Tail
  c.strokeStyle = k.color; c.lineWidth = 3;
  c.beginPath();
  c.moveTo(-s*0.1, s*0.2);
  c.quadraticCurveTo(-s*0.4, s*0.1 + Math.sin(k.wobble)*s*0.15, -s*0.3, s*0.35);
  c.stroke();

  c.restore();
}

// Draw anime-style kaiju (Godzilla-like)
function drawKaiju(k) {
  const c = cctx;
  const s = k.size;
  c.save();
  c.translate(k.x, k.y);

  // Body
  c.fillStyle = k.color;
  c.beginPath();
  c.ellipse(0, 0, s*0.4, s*0.6, 0, 0, Math.PI*2);
  c.fill();
  c.strokeStyle = '#000'; c.lineWidth = 2; c.stroke();

  // Spines down the back
  c.fillStyle = k.spineColor;
  for(let i = -3; i <= 3; i++) {
    c.beginPath();
    const sy = i * s*0.12;
    c.moveTo(-s*0.35, sy - s*0.06);
    c.lineTo(-s*0.55, sy);
    c.lineTo(-s*0.35, sy + s*0.06);
    c.fill();
  }

  // Head
  c.fillStyle = k.color;
  c.beginPath();
  c.ellipse(s*0.35, -s*0.15, s*0.25, s*0.2, -0.2, 0, Math.PI*2);
  c.fill(); c.strokeStyle = '#000'; c.stroke();

  // Jaw
  c.fillStyle = k.color;
  c.beginPath();
  c.moveTo(s*0.45, -s*0.05);
  c.lineTo(s*0.7, s*0.05 + Math.sin(k.mouthOpen)*s*0.08);
  c.lineTo(s*0.45, s*0.1);
  c.fill(); c.stroke();

  // Teeth
  c.fillStyle = '#fff';
  const jawY = s*0.05 + Math.sin(k.mouthOpen)*s*0.08;
  for(let i = 0; i < 4; i++) {
    const tx = s*0.48 + i*s*0.05;
    c.beginPath();
    c.moveTo(tx, -s*0.04); c.lineTo(tx+s*0.02, s*0.02); c.lineTo(tx+s*0.04, -s*0.04);
    c.fill();
  }

  // Eyes (angry, glowing)
  c.fillStyle = '#ff0000';
  c.shadowColor = '#ff0000'; c.shadowBlur = 8;
  c.beginPath(); c.ellipse(s*0.4, -s*0.25, s*0.06, s*0.04, -0.3, 0, Math.PI*2); c.fill();
  c.fillStyle = '#ff8800';
  c.beginPath(); c.arc(s*0.4, -s*0.25, s*0.025, 0, Math.PI*2); c.fill();
  c.shadowBlur = 0;

  // Arms (small T-rex style)
  c.fillStyle = k.color; c.strokeStyle = '#000'; c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(s*0.15, -s*0.15); c.lineTo(s*0.2, -s*0.3); c.lineTo(s*0.25, -s*0.2);
  c.fill(); c.stroke();

  // Legs
  c.beginPath();
  c.ellipse(-s*0.1, s*0.55, s*0.12, s*0.15, 0, 0, Math.PI*2);
  c.fill(); c.stroke();
  c.beginPath();
  c.ellipse(s*0.15, s*0.55, s*0.12, s*0.15, 0, 0, Math.PI*2);
  c.fill(); c.stroke();

  // Tail
  c.strokeStyle = k.color; c.lineWidth = s*0.12;
  c.beginPath();
  c.moveTo(-s*0.35, s*0.1);
  c.quadraticCurveTo(-s*0.7, s*0.3 + Math.sin(k.mouthOpen*2)*s*0.1, -s*0.9, s*0.05);
  c.stroke();
  c.strokeStyle = '#000'; c.lineWidth = 2;
  c.beginPath();
  c.moveTo(-s*0.35, s*0.1);
  c.quadraticCurveTo(-s*0.7, s*0.3 + Math.sin(k.mouthOpen*2)*s*0.1, -s*0.9, s*0.05);
  c.stroke();

  c.restore();

  // Mouth blast (Godzilla beam)
  if(k.blasting) {
    c.save();
    const bx = k.x + s*0.7;
    const by = k.y + Math.sin(k.mouthOpen)*s*0.08;
    const blastLen = s*2.5;
    const grad = c.createLinearGradient(bx, by, bx + blastLen, by);
    grad.addColorStop(0, 'rgba(0,200,255,0.9)');
    grad.addColorStop(0.3, 'rgba(100,0,255,0.6)');
    grad.addColorStop(1, 'rgba(255,0,100,0)');
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(bx, by - s*0.05);
    c.lineTo(bx + blastLen, by - s*0.3 + Math.sin(k.mouthOpen*3)*s*0.1);
    c.lineTo(bx + blastLen, by + s*0.3 + Math.sin(k.mouthOpen*3)*s*0.1);
    c.lineTo(bx, by + s*0.05);
    c.fill();
    // Inner glow
    c.shadowColor = '#00ccff'; c.shadowBlur = 20;
    c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + blastLen*0.8, by); c.stroke();
    c.shadowBlur = 0;
    c.restore();
  }
}

function spawnKitten() {
  const side = Math.floor(Math.random() * 4);
  const w = chaosCanvas.width, h = chaosCanvas.height;
  let x, y, vx, vy;
  if(side===0){x=-50;y=Math.random()*h;vx=1.5+Math.random()*2.5;vy=(Math.random()-0.5)*2;}
  else if(side===1){x=w+50;y=Math.random()*h;vx=-(1.5+Math.random()*2.5);vy=(Math.random()-0.5)*2;}
  else if(side===2){x=Math.random()*w;y=-50;vx=(Math.random()-0.5)*2;vy=1.5+Math.random()*2.5;}
  else{x=Math.random()*w;y=h+50;vx=(Math.random()-0.5)*2;vy=-(1.5+Math.random()*2.5);}
  const powers = ['laser','sword','claw','fly'];
  const eyeColors = ['#00ccff','#ff00ff','#00ff00','#ffcc00'];
  kittens.push({
    x, y, vx, vy,
    color: KITTEN_COLORS[Math.floor(Math.random()*KITTEN_COLORS.length)],
    capeColor: POWER_COLORS[Math.floor(Math.random()*POWER_COLORS.length)],
    eyeColor: eyeColors[Math.floor(Math.random()*eyeColors.length)],
    power: powers[Math.floor(Math.random()*powers.length)],
    size: 30 + Math.random()*25,
    life: 350 + Math.random()*400,
    wobble: Math.random()*Math.PI*2
  });
}

function spawnKaiju() {
  const w = chaosCanvas.width, h = chaosCanvas.height;
  kaijus.push({
    x: Math.random()*w*0.6 + w*0.2,
    y: h*0.45 + Math.random()*h*0.2,
    color: KAIJU_COLORS[Math.floor(Math.random()*KAIJU_COLORS.length)],
    spineColor: `hsl(${Math.random()*60+160},80%,50%)`,
    size: Math.min(w, h) * (0.45 + Math.random() * 0.3),   // scales with the screen
    life: 300 + Math.random()*400,
    vx: (Math.random()-0.5)*0.8,
    vy: (Math.random()-0.5)*0.3,
    mouthOpen: Math.random()*Math.PI*2,
    blasting: false,
    blastTimer: 0
  });
}

function spawnParticle(x, y, color) {
  const c = color || POWER_COLORS[Math.floor(Math.random()*POWER_COLORS.length)];
  particles.push({
    x, y, color: c,
    size: 3 + Math.random()*5,
    life: 25 + Math.random()*35,
    maxLife: 25 + Math.random()*35,
    vx: (Math.random()-0.5)*8,
    vy: (Math.random()-0.5)*8
  });
}

function spawnLaser(x, y, tx, ty) {
  lasers.push({ x, y, tx, ty, life: 8, color: `hsl(${Math.random()*360},100%,60%)` });
}


// ===== NIGHT SKY: twinkling stars, shooting stars, bouncing planets with moons =====
const skyStars = [], planets = [];
let shootingStar = null;
const PLANET_LOOKS = [
  { hue: 18,  bands: true,  ring: false },   // rusty gas giant
  { hue: 200, bands: false, ring: true  },   // icy ringed planet
  { hue: 300, bands: true,  ring: false },   // candy purple
  { hue: 140, bands: false, ring: false },   // little green one
  { hue: 45,  bands: true,  ring: true  }    // golden ringed
];

function initSky() {
  const w = chaosCanvas.width, h = chaosCanvas.height;
  skyStars.length = 0; planets.length = 0; shootingStar = null;
  const count = Math.round(w * h / 5000);
  for(let i = 0; i < count; i++) {
    skyStars.push({ x: Math.random() * w, y: Math.random() * h * 0.8,
                    r: Math.random() < 0.9 ? 0.4 + Math.random() * 1.1 : 1.5 + Math.random() * 1.2,
                    tw: Math.random() * Math.PI * 2, sp: 0.02 + Math.random() * 0.05 });
  }
  const scale = Math.min(w, h);
  const looks = PLANET_LOOKS.slice().sort(() => Math.random() - 0.5).slice(0, w < 700 ? 3 : 4);
  looks.forEach((look, i) => {
    const r = scale * (0.04 + Math.random() * 0.05);
    const moons = [];
    for(let m = 0; m < 1 + Math.floor(Math.random() * 2); m++) {
      moons.push({ dist: r * (1.6 + m * 0.7 + Math.random() * 0.3), ang: Math.random() * Math.PI * 2,
                   speed: 0.015 + Math.random() * 0.02, r: r * (0.16 + Math.random() * 0.1) });
    }
    planets.push({ ...look, r, moons, squash: 0,
      x: w * (0.15 + 0.7 * (i + 0.5) / looks.length), y: h * (0.15 + Math.random() * 0.3),
      vx: (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.6), vy: 0,
      hop: 7 + Math.random() * 4 });
  });
}

function drawSky(w, h, groundY) {
  // deep midnight, a little lighter toward the horizon
  const sky = cctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#03020b');
  sky.addColorStop(0.6, '#0b0a24');
  sky.addColorStop(1, '#1a1240');
  cctx.fillStyle = sky;
  cctx.fillRect(0, 0, w, h);
  if(groove.flash > 0.02) {   // soft pulse on the beat
    cctx.fillStyle = `hsla(${(bgPhase*120)%360},90%,60%,${(groove.flash*0.1).toFixed(3)})`;
    cctx.fillRect(0, 0, w, h);
  }

  // twinkling stars, brighter when the music is louder
  skyStars.forEach(st => {
    st.tw += st.sp;
    const a = Math.min(1, (0.35 + 0.65 * Math.abs(Math.sin(st.tw))) * (0.75 + groove.level * 0.6));
    cctx.fillStyle = `rgba(255,255,240,${a.toFixed(2)})`;
    cctx.beginPath(); cctx.arc(st.x, st.y, st.r * (1 + groove.flash * 0.6), 0, Math.PI * 2); cctx.fill();
  });

  // a shooting star now and then
  if(!shootingStar && Math.random() < 0.006) {
    shootingStar = { x: Math.random() * w * 0.7, y: Math.random() * h * 0.3, life: 40,
                     vx: 9 + Math.random() * 5, vy: 3 + Math.random() * 2 };
  }
  if(shootingStar) {
    const ss = shootingStar;
    ss.x += ss.vx; ss.y += ss.vy; ss.life--;
    const tail = cctx.createLinearGradient(ss.x, ss.y, ss.x - ss.vx * 8, ss.y - ss.vy * 8);
    tail.addColorStop(0, `rgba(255,255,255,${(ss.life / 40).toFixed(2)})`);
    tail.addColorStop(1, 'rgba(255,255,255,0)');
    cctx.strokeStyle = tail; cctx.lineWidth = 2;
    cctx.beginPath(); cctx.moveTo(ss.x, ss.y); cctx.lineTo(ss.x - ss.vx * 8, ss.y - ss.vy * 8); cctx.stroke();
    if(ss.life <= 0) shootingStar = null;
  }
}

function drawMoon(m, p, behind) {
  const tilt = 0.35;
  const mx = p.x + Math.cos(m.ang) * m.dist, my = p.y + Math.sin(m.ang) * m.dist * tilt;
  if((Math.sin(m.ang) < 0) !== behind) return;
  const g = cctx.createRadialGradient(mx - m.r * 0.3, my - m.r * 0.3, m.r * 0.1, mx, my, m.r);
  g.addColorStop(0, '#f4f1e8'); g.addColorStop(1, '#8d8a9e');
  cctx.fillStyle = g;
  cctx.beginPath(); cctx.arc(mx, my, m.r, 0, Math.PI * 2); cctx.fill();
}

function drawRing(p, half) {
  // half: 'back' draws the far side of the ring, 'front' the near side
  cctx.strokeStyle = `hsla(${p.hue + 30},70%,75%,0.8)`;
  cctx.lineWidth = Math.max(2, p.r * 0.14);
  cctx.beginPath();
  if(half === 'back') cctx.ellipse(p.x, p.y, p.r * 1.8, p.r * 0.45, -0.25, Math.PI, Math.PI * 2);
  else cctx.ellipse(p.x, p.y, p.r * 1.8, p.r * 0.45, -0.25, 0, Math.PI);
  cctx.stroke();
}

function updateAndDrawPlanets(w, groundY) {
  planets.forEach(p => {
    // bounce along the skyline like balls; each beat sends them higher
    p.vy += 0.18;
    p.x += p.vx; p.y += p.vy;
    if(p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx); }
    if(p.x > w - p.r) { p.x = w - p.r; p.vx = -Math.abs(p.vx); }
    const floor = groundY - p.r * (1 - p.squash * 0.25);
    if(p.y > floor) { p.y = floor; p.vy = -p.hop; p.squash = 1; }
    if(groove.beat > 0.95 && p.vy > -2) p.vy = -p.hop * 1.25;
    p.squash *= 0.85;
    p.moons.forEach(m => { m.ang += m.speed * (1 + groove.level); });

    p.moons.forEach(m => drawMoon(m, p, true));
    if(p.ring) drawRing(p, 'back');

    cctx.save();
    cctx.translate(p.x, p.y);
    cctx.scale(1 + p.squash * 0.2, 1 - p.squash * 0.2);   // squish on landing
    const g = cctx.createRadialGradient(-p.r * 0.35, -p.r * 0.35, p.r * 0.1, 0, 0, p.r);
    g.addColorStop(0, `hsl(${p.hue},85%,75%)`);
    g.addColorStop(0.7, `hsl(${p.hue},70%,50%)`);
    g.addColorStop(1, `hsl(${p.hue},70%,28%)`);
    cctx.fillStyle = g;
    cctx.beginPath(); cctx.arc(0, 0, p.r, 0, Math.PI * 2); cctx.fill();
    if(p.bands) {
      cctx.save();
      cctx.beginPath(); cctx.arc(0, 0, p.r, 0, Math.PI * 2); cctx.clip();
      cctx.fillStyle = `hsla(${p.hue + 15},70%,35%,0.35)`;
      [-0.45, -0.1, 0.3].forEach(b => cctx.fillRect(-p.r, b * p.r, p.r * 2, p.r * 0.16));
      cctx.restore();
    }
    cctx.restore();

    if(p.ring) drawRing(p, 'front');
    p.moons.forEach(m => drawMoon(m, p, false));
  });
}

// ===== GIANT OCTOPUS =====
// Rises from the bottom now and then, waves eight tentacles, watches the
// kittens with big eyes, and curls along with the beat before sinking away.
let octopus = null, nextOctopusAt = 0;

function spawnOctopus() {
  const w = chaosCanvas.width, h = chaosCanvas.height;
  octopus = {
    x: w * (0.3 + Math.random() * 0.4),
    size: Math.min(w, h) * (0.5 + Math.random() * 0.15),
    hue: [285, 320, 345, 15][Math.floor(Math.random() * 4)],
    rise: 0, state: 'rising', stay: 900 + Math.random() * 600,
    phase: Math.random() * 10, flex: 0, blink: 0
  };
}

function updateOctopus() {
  const now = performance.now();
  if(!octopus) {
    if(now > nextOctopusAt) spawnOctopus();
    return;
  }
  const o = octopus;
  o.phase += 0.02 + groove.level * 0.05;
  if(groove.beat > 0.95) o.flex = 1;
  o.flex *= 0.93;
  if(o.blink > 0) o.blink--; else if(Math.random() < 0.004) o.blink = 8;
  if(o.state === 'rising') { o.rise += 0.006; if(o.rise >= 1) { o.rise = 1; o.state = 'staying'; } }
  else if(o.state === 'staying') { if(--o.stay <= 0) o.state = 'sinking'; }
  else { o.rise -= 0.005; if(o.rise <= 0) { octopus = null; nextOctopusAt = now + 20000 + Math.random() * 25000; } }
}

function octopusHead() {
  const o = octopus, h = chaosCanvas.height;
  const ease = o.rise * o.rise * (3 - 2 * o.rise);   // smooth in and out
  return { x: o.x + Math.sin(o.phase * 0.5) * o.size * 0.08,
           y: h + o.size * 0.55 - ease * o.size * 1.05 };
}

function drawOctopus() {
  if(!octopus) return;
  const o = octopus, c = cctx, s = o.size;
  const head = octopusHead();
  const body = `hsl(${o.hue},70%,${48 + o.flex * 10}%)`;
  const dark = `hsl(${o.hue},70%,32%)`;
  const belly = `hsl(${o.hue + 20},80%,72%)`;

  // tentacles: chains of segments that taper and curl
  const segs = 22, len = s * 1.15;
  for(let t = 0; t < 8; t++) {
    const spread = (t - 3.5) / 3.5;                      // -1 .. 1
    let ang = Math.PI / 2 + spread * 1.35;               // fan out downwards and sideways
    let x = head.x + spread * s * 0.22, y = head.y + s * 0.18;
    const curl = 0.07 + groove.level * 0.05 + o.flex * 0.12;
    const pts = [[x, y]];
    for(let i = 0; i < segs; i++) {
      ang += Math.sin(o.phase * 2 + t * 0.9 + i * 0.35) * curl - spread * 0.03;
      x += Math.cos(ang) * len / segs;
      y += Math.sin(ang) * len / segs;
      pts.push([x, y]);
    }
    c.lineCap = 'round';
    for(let i = 0; i < segs; i++) {
      const thick = s * 0.09 * (1 - i / segs) + 2;
      c.strokeStyle = body; c.lineWidth = thick;
      c.beginPath(); c.moveTo(pts[i][0], pts[i][1]); c.lineTo(pts[i+1][0], pts[i+1][1]); c.stroke();
      if(i % 3 === 1 && thick > 6) {                     // suckers
        c.fillStyle = belly;
        c.beginPath(); c.arc(pts[i][0], pts[i][1], thick * 0.22, 0, Math.PI * 2); c.fill();
      }
    }
  }

  // head
  const squash = 1 + o.flex * 0.06;
  const g = c.createRadialGradient(head.x - s * 0.1, head.y - s * 0.25, s * 0.05, head.x, head.y, s * 0.45);
  g.addColorStop(0, belly); g.addColorStop(0.5, body); g.addColorStop(1, dark);
  c.fillStyle = g;
  c.beginPath(); c.ellipse(head.x, head.y - s * 0.12, s * 0.3 * squash, s * 0.38 / squash, 0, 0, Math.PI * 2); c.fill();
  // spots
  c.fillStyle = `hsla(${o.hue},70%,30%,0.45)`;
  [[-0.12,-0.33,0.04],[0.1,-0.38,0.03],[0.15,-0.22,0.025],[-0.17,-0.18,0.03]].forEach(([dx,dy,r]) => {
    c.beginPath(); c.arc(head.x + dx * s, head.y + dy * s, r * s, 0, Math.PI * 2); c.fill();
  });

  // eyes follow the nearest kitten, glow on the beat
  const target = kittens.reduce((best, k) => {
    const d = Math.hypot(k.x - head.x, k.y - head.y);
    return !best || d < best.d ? { k, d } : best;
  }, null);
  [-1, 1].forEach(side => {
    const ex = head.x + side * s * 0.12, ey = head.y - s * 0.05, er = s * 0.075;
    if(o.flex > 0.3) { c.shadowColor = '#ff0'; c.shadowBlur = 20 * o.flex; }
    c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(ex, ey, er, o.blink ? er * 0.15 : er, 0, 0, Math.PI * 2); c.fill();
    c.shadowBlur = 0;
    if(!o.blink) {
      let px = 0, py = 0;
      if(target) { const a = Math.atan2(target.k.y - ey, target.k.x - ex); px = Math.cos(a) * er * 0.45; py = Math.sin(a) * er * 0.45; }
      c.fillStyle = '#111';
      c.beginPath(); c.arc(ex + px, ey + py, er * 0.45, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(ex + px - er * 0.15, ey + py - er * 0.18, er * 0.14, 0, Math.PI * 2); c.fill();
    }
  });
  // little smile, bigger on the beat
  c.strokeStyle = dark; c.lineWidth = Math.max(2, s * 0.012);
  c.beginPath(); c.arc(head.x, head.y + s * 0.05, s * (0.04 + o.flex * 0.03), 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
}

function initChaosScene() {
  buildings.length = 0; trees.length = 0;
  octopus = null; nextOctopusAt = performance.now() + 4000;   // first visit soon after picking Chaos
  initSky();
  kittens.length = 0; kaijus.length = 0; particles.length = 0; lasers.length = 0;
  const w = chaosCanvas.width, h = chaosCanvas.height;
  for(let i=0;i<14;i++) buildings.push({x:(w/14)*i, w:25+Math.random()*55, h:80+Math.random()*180, hue:Math.random()*360});
  for(let i=0;i<10;i++) trees.push({x:Math.random()*w, h:50+Math.random()*70, hue:90+Math.random()*60});
}

let bgPhase = 0;
/* ----- listening to the music (Chaos dances along) -----
   All parts feed one analyser after their volume/mute/solo, so the scene
   reacts only to what you can hear. A "beat" is a sudden rise in loudness
   compared with the moment before, which suits choir singing better than
   waiting for a kick drum. */
let analyser = null, freqData = null;
let shortRms = 0, longRms = 0, lastBeatAt = 0, loudMax = 0.02, beatArmed = true;
const groove = { level: 0, beat: 0, flash: 0 };   // beat and flash decay each frame

function listen() {
  if(!analyser || !isPlaying) { groove.level *= 0.9; groove.beat *= 0.85; groove.flash *= 0.85; return; }
  analyser.getByteTimeDomainData(freqData);
  let sq = 0;
  for(let i = 0; i < freqData.length; i++) { const v = (freqData[i] - 128) / 128; sq += v * v; }
  const rms = Math.sqrt(sq / freqData.length);
  // compare with the loudest moment lately, so quiet recordings dance too
  loudMax = Math.max(rms, loudMax * 0.998, 0.02);
  groove.level += (rms / loudMax - groove.level) * 0.25;
  // a beat = the last ~50 ms clearly louder than the last ~1 s,
  // so vibrato and long held notes don't count
  shortRms += (rms - shortRms) * 0.3;
  longRms += (rms - longRms) * 0.02;
  const now = performance.now();
  // each entry counts once: the sound has to settle before the next beat can fire
  if(shortRms < longRms * 1.15) beatArmed = true;
  if(beatArmed && shortRms > longRms * 1.3 && shortRms > loudMax * 0.3 && now - lastBeatAt > 280) {
    lastBeatAt = now; beatArmed = false;
    groove.beat = 1; groove.flash = 1;
    onBeat();
  }
  groove.beat *= 0.88; groove.flash *= 0.82;
}

function onBeat() {
  kittens.forEach(k => { k.hop = 1; });
  // sparks from a few kittens
  for(let i = 0; i < Math.min(4, kittens.length); i++) {
    const k = kittens[Math.floor(Math.random()*kittens.length)];
    for(let p = 0; p < 6; p++) spawnParticle(k.x, k.y, k.capeColor);
  }
  if(Math.random() < 0.5) spawnKitten();
  kaijus.forEach(kj => { if(Math.random() < 0.35) { kj.blasting = true; kj.blastTimer = 40; } });
}

function drawChaos() {
  if(!chaosRunning) return;
  const w = chaosCanvas.width, h = chaosCanvas.height;
  listen();
  bgPhase += 0.003 + groove.level * 0.01;

  const cityAmount = (Math.sin(bgPhase)+1)/2;   // city and forest still take turns on the horizon
  const groundY = h*0.75;
  drawSky(w, h, groundY);

  // Mountains (forest phase)
  cctx.globalAlpha = 1-cityAmount;
  for(let i=0;i<6;i++) {
    const mx = (w/6)*i+w/12;
    const mh = 100+Math.sin(i*2.5)*60;
    cctx.fillStyle = `hsl(${200+i*15},20%,${15+i*3}%)`;
    cctx.beginPath(); cctx.moveTo(mx-120,groundY); cctx.lineTo(mx,groundY-mh); cctx.lineTo(mx+120,groundY); cctx.fill();
  }

  // Trees (forest)
  trees.forEach(t => {
    cctx.fillStyle = '#3a2000';
    cctx.fillRect(t.x-3, groundY-t.h*0.35, 6, t.h*0.35);
    cctx.fillStyle = `hsl(${t.hue},55%,28%)`;
    cctx.beginPath(); cctx.arc(t.x, groundY-t.h*0.45, t.h*0.3, 0, Math.PI*2); cctx.fill();
  });
  cctx.globalAlpha = 1;

  // Buildings (city)
  cctx.globalAlpha = cityAmount;
  buildings.forEach(b => {
    cctx.fillStyle = `hsl(${b.hue},40%,20%)`;
    cctx.fillRect(b.x, groundY-b.h, b.w, b.h);
    cctx.fillStyle = `hsla(${50 + groove.flash*250},100%,${70 + groove.flash*20}%,${(0.5 + groove.flash*0.5).toFixed(2)})`;
    for(let wy=groundY-b.h+10;wy<groundY-10;wy+=18)
      for(let wx=b.x+4;wx<b.x+b.w-4;wx+=10)
        cctx.fillRect(wx,wy,5,7);
  });
  cctx.globalAlpha = 1;

  // Ground
  const gHue = cityAmount>0.5 ? 220 : 130;
  cctx.fillStyle = `hsl(${gHue},25%,12%)`;
  cctx.fillRect(0,groundY,w,h-groundY);

  updateAndDrawPlanets(w, groundY);

  // Spawn
  if(Math.random() < 0.05 + groove.level*0.12) spawnKitten();
  if(Math.random() < 0.008 + groove.level*0.01 && kaijus.length<2) spawnKaiju();

  // Update & draw kaijus
  for(let i=kaijus.length-1;i>=0;i--) {
    const k = kaijus[i];
    k.x += k.vx; k.y += k.vy; k.life--; k.mouthOpen += 0.05;
    k.blastTimer--;
    if(k.blastTimer <= 0) { k.blasting = Math.random()<0.3; k.blastTimer = 60+Math.random()*100; }
    if(k.life<=0||k.x<-150||k.x>w+150) { kaijus.splice(i,1); continue; }
    drawKaiju(k);
  }

  // Octopus rises in front of the city, behind the kittens
  updateOctopus();
  drawOctopus();

  // Update & draw kittens
  for(let i=kittens.length-1;i>=0;i--) {
    const k = kittens[i];
    k.wobble += 0.08 + groove.level*0.35;
    k.hop = (k.hop || 0) * 0.86;
    k.x += k.vx * (1 + groove.level*1.5); k.y += k.vy + Math.sin(k.wobble)*0.6; k.life--;
    if(k.life<=0||k.x<-70||k.x>w+70||k.y<-70||k.y>h+70) { kittens.splice(i,1); continue; }
    drawKitten(k);
    // Superpowers
    if(Math.random()<0.06) spawnParticle(k.x, k.y, k.capeColor);
    // Laser eyes at nearest kaiju
    if(k.power==='laser' && Math.random()<0.04) {
      const foes = kaijus.slice();
      if(octopus && octopus.rise > 0.5) { const hd = octopusHead(); foes.push({ x: hd.x, y: hd.y - octopus.size * 0.15 }); }
      const closest = foes.reduce((best,kj)=>{const d=Math.hypot(k.x-kj.x,k.y-kj.y);return d<(best?best.d:999)?{kj,d}:best;},null);
      if(closest) {
        spawnLaser(k.x, k.y-k.size*0.4, closest.kj.x, closest.kj.y);
        for(let p=0;p<4;p++) spawnParticle(closest.kj.x+(Math.random()-0.5)*30, closest.kj.y+(Math.random()-0.5)*30, '#ff0');
      }
    }
    // Claw slash sparks near kaiju
    if(k.power==='claw') {
      kaijus.forEach(kj=>{
        if(Math.hypot(k.x-kj.x,k.y-kj.y)<100 && Math.random()<0.1)
          for(let p=0;p<5;p++) spawnParticle((k.x+kj.x)/2,(k.y+kj.y)/2,'#fff');
      });
    }
  }

  // Lasers
  for(let i=lasers.length-1;i>=0;i--) {
    const l = lasers[i]; l.life--;
    if(l.life<=0){lasers.splice(i,1);continue;}
    cctx.globalAlpha = l.life/8;
    cctx.strokeStyle = l.color; cctx.lineWidth = 2;
    cctx.shadowColor = l.color; cctx.shadowBlur = 8;
    cctx.beginPath(); cctx.moveTo(l.x,l.y); cctx.lineTo(l.tx,l.ty); cctx.stroke();
    cctx.shadowBlur = 0;
  }
  cctx.globalAlpha = 1;

  // Particles (explosion sparks)
  for(let i=particles.length-1;i>=0;i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if(p.life<=0){particles.splice(i,1);continue;}
    cctx.globalAlpha = p.life/p.maxLife;
    cctx.fillStyle = p.color;
    cctx.shadowColor = p.color; cctx.shadowBlur = 4;
    cctx.beginPath(); cctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2); cctx.fill();
    cctx.shadowBlur = 0;
  }
  cctx.globalAlpha = 1;

  requestAnimationFrame(drawChaos);
}

function startChaos() {
  if(chaosRunning) return;
  chaosRunning = true;
  resizeChaos();
  initChaosScene();
  drawChaos();
}
function stopChaos() { chaosRunning = false; }

// ===== DEEP SEA SCENE =====
// Bioluminescent jellyfish drifting up, plankton, light rays from the surface.
const jellies = [];
const plankton = [];
let seaPhase = 0;
const JELLY_COLORS = ['79,242,233','140,160,255','255,150,220','120,255,190'];
function spawnJelly(startAnywhere) {
  const w = chaosCanvas.width, h = chaosCanvas.height;
  jellies.push({
    x: Math.random()*w,
    y: startAnywhere ? Math.random()*h : h + 80,
    size: 22 + Math.random()*38,
    rgb: JELLY_COLORS[Math.floor(Math.random()*JELLY_COLORS.length)],
    vy: 0.15 + Math.random()*0.3,
    sway: Math.random()*Math.PI*2,
    swaySpeed: 0.008 + Math.random()*0.012,
    pulse: Math.random()*Math.PI*2
  });
}
function initDeepsea() {
  jellies.length = 0; plankton.length = 0;
  const w = chaosCanvas.width, h = chaosCanvas.height;
  for(let i=0;i<6;i++) spawnJelly(true);
  for(let i=0;i<50;i++) plankton.push({ x: Math.random()*w, y: Math.random()*h, r: 0.6+Math.random()*1.6, tw: Math.random()*Math.PI*2, vx: (Math.random()-0.5)*0.08, vy: -(0.03+Math.random()*0.12) });
}
function drawJelly(j) {
  const s = j.size;
  const pulse = 1 + Math.sin(j.pulse)*0.08;
  const x = j.x + Math.sin(j.sway)*s*0.8;
  cctx.save();
  cctx.translate(x, j.y);
  // Glow halo
  const halo = cctx.createRadialGradient(0,0,0,0,0,s*2.2);
  halo.addColorStop(0,'rgba('+j.rgb+',0.16)');
  halo.addColorStop(1,'rgba('+j.rgb+',0)');
  cctx.fillStyle = halo;
  cctx.beginPath(); cctx.arc(0,0,s*2.2,0,Math.PI*2); cctx.fill();
  // Bell
  const bell = cctx.createRadialGradient(0,-s*0.2,s*0.1,0,0,s*pulse);
  bell.addColorStop(0,'rgba(255,255,255,0.55)');
  bell.addColorStop(0.55,'rgba('+j.rgb+',0.4)');
  bell.addColorStop(1,'rgba('+j.rgb+',0.06)');
  cctx.fillStyle = bell;
  cctx.beginPath();
  cctx.ellipse(0,0,s*pulse,s*0.75*pulse,0,Math.PI,0);
  cctx.quadraticCurveTo(s*pulse*0.7, s*0.35, 0, s*0.28);
  cctx.quadraticCurveTo(-s*pulse*0.7, s*0.35, -s*pulse, 0);
  cctx.fill();
  // Tentacles
  cctx.strokeStyle = 'rgba('+j.rgb+',0.35)';
  cctx.lineWidth = 1.4;
  for(let t=0;t<5;t++) {
    const tx = (t-2)*s*0.28;
    const wave = Math.sin(j.sway*2 + t)*s*0.35;
    cctx.beginPath();
    cctx.moveTo(tx*0.8, s*0.25);
    cctx.bezierCurveTo(tx + wave*0.4, s*0.9, tx - wave*0.6, s*1.6, tx + wave, s*2.3);
    cctx.stroke();
  }
  cctx.restore();
}
function drawDeepsea() {
  if(currentScene !== 'deepsea') return;
  const w = chaosCanvas.width, h = chaosCanvas.height;
  if(w < 2 || h < 2) { resizeChaos(); requestAnimationFrame(drawDeepsea); return; }
  seaPhase += 0.004;
  cctx.clearRect(0,0,w,h);

  // Light rays from the surface
  for(let i=0;i<4;i++) {
    const rx = w*(0.12 + i*0.24) + Math.sin(seaPhase + i*1.7)*w*0.03;
    const g = cctx.createLinearGradient(rx, 0, rx + w*0.06, h*0.8);
    g.addColorStop(0, 'rgba(120,220,235,'+(0.05+0.02*Math.sin(seaPhase*2+i))+')');
    g.addColorStop(1, 'rgba(120,220,235,0)');
    cctx.fillStyle = g;
    cctx.beginPath();
    cctx.moveTo(rx, 0); cctx.lineTo(rx + w*0.08, 0);
    cctx.lineTo(rx + w*0.22, h*0.85); cctx.lineTo(rx + w*0.05, h*0.85);
    cctx.fill();
  }

  // Plankton
  plankton.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.tw += 0.03;
    if(p.y < -5) { p.y = h+5; p.x = Math.random()*w; }
    if(p.x < -5) p.x = w+5; if(p.x > w+5) p.x = -5;
    cctx.fillStyle = 'rgba(190,255,248,'+(0.15+0.25*Math.abs(Math.sin(p.tw)))+')';
    cctx.beginPath(); cctx.arc(p.x,p.y,p.r,0,Math.PI*2); cctx.fill();
  });

  // Jellyfish
  for(let i=jellies.length-1;i>=0;i--) {
    const j = jellies[i];
    j.y -= j.vy; j.sway += j.swaySpeed; j.pulse += 0.05;
    if(j.y < -j.size*3) { jellies.splice(i,1); spawnJelly(false); continue; }
    drawJelly(j);
  }

  requestAnimationFrame(drawDeepsea);
}

// ===== LOFI GIRL SCENE =====
// Rain running down the window, a warm lamp in the corner, slow bokeh lights.
const drops = [];
const bokeh = [];
let lofiPhase = 0;

function initLofi() {
  drops.length = 0; bokeh.length = 0;
  const w = chaosCanvas.width, h = chaosCanvas.height;
  for(let i = 0; i < 150; i++) {
    drops.push({ x: Math.random()*w, y: Math.random()*h, len: 8 + Math.random()*24,
                 vy: 3 + Math.random()*5, alpha: 0.06 + Math.random()*0.20 });
  }
  for(let i = 0; i < 22; i++) {
    bokeh.push({ x: Math.random()*w, y: Math.random()*h, r: 14 + Math.random()*46,
                 hue: 18 + Math.random()*40, drift: (Math.random()-0.5)*0.16,
                 vy: -(0.04 + Math.random()*0.14), alpha: 0.05 + Math.random()*0.10,
                 pulse: Math.random()*Math.PI*2 });
  }
}

function drawLofi() {
  if(currentScene !== 'lofi') return;
  const w = chaosCanvas.width, h = chaosCanvas.height;
  if(w < 2 || h < 2) { resizeChaos(); requestAnimationFrame(drawLofi); return; }
  lofiPhase += 0.006;
  cctx.clearRect(0, 0, w, h);

  // warm lamp glow, gently breathing
  const breathe = 0.16 + 0.05 * Math.sin(lofiPhase);
  const lamp = cctx.createRadialGradient(w*0.84, h*0.10, 0, w*0.84, h*0.10, Math.max(w,h)*0.6);
  lamp.addColorStop(0, 'rgba(255,186,120,' + breathe.toFixed(3) + ')');
  lamp.addColorStop(0.45, 'rgba(255,150,90,0.055)');
  lamp.addColorStop(1, 'rgba(0,0,0,0)');
  cctx.fillStyle = lamp;
  cctx.fillRect(0, 0, w, h);

  // drifting bokeh
  bokeh.forEach(b => {
    b.x += b.drift; b.y += b.vy; b.pulse += 0.01;
    if(b.y + b.r < 0) { b.y = h + b.r; b.x = Math.random()*w; }
    if(b.x < -b.r) b.x = w + b.r;
    if(b.x > w + b.r) b.x = -b.r;
    const a = b.alpha * (0.7 + 0.3*Math.sin(b.pulse));
    const g = cctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    g.addColorStop(0, 'hsla(' + b.hue.toFixed(0) + ',80%,70%,' + a.toFixed(3) + ')');
    g.addColorStop(1, 'hsla(30,80%,60%,0)');
    cctx.fillStyle = g;
    cctx.beginPath(); cctx.arc(b.x, b.y, b.r, 0, Math.PI*2); cctx.fill();
  });

  // rain, slanted a touch
  cctx.lineWidth = 1.1;
  drops.forEach(d => {
    d.y += d.vy; d.x += 0.6;
    if(d.y > h) { d.y = -d.len; d.x = Math.random()*w; }
    if(d.x > w) d.x = 0;
    cctx.strokeStyle = 'rgba(255,225,200,' + d.alpha.toFixed(3) + ')';
    cctx.beginPath(); cctx.moveTo(d.x, d.y); cctx.lineTo(d.x - 1.6, d.y - d.len); cctx.stroke();
  });

  // vignette keeps the controls readable on top
  const vig = cctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.25, w/2, h/2, Math.max(w,h)*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.34)');
  cctx.fillStyle = vig;
  cctx.fillRect(0, 0, w, h);

  requestAnimationFrame(drawLofi);
}

// ===== SCENE DISPATCHER =====
let currentScene = null;
function startScene(name) {
  if(currentScene === name) return;
  chaosRunning = false;
  currentScene = name;
  resizeChaos();
  if(name === 'chaos') startChaos();
  else if(name === 'deepsea') { initDeepsea(); drawDeepsea(); }
  else if(name === 'lofi') { initLofi(); drawLofi(); }
}
function stopScene() {
  currentScene = null;
  chaosRunning = false;
  cctx.clearRect(0, 0, chaosCanvas.width, chaosCanvas.height);
}
function restartScene() {
  if(!currentScene) return;
  const n = currentScene;
  currentScene = null;
  chaosRunning = false;
  startScene(n);
}

const WAVE_COLOR = { white:'#0066cc', dark:'#7f93b5', rainbow:'#ffffff', deepsea:'#4ff2e9', chaos:'#ff5cf5', lofi:'#f0b184' };
const THEMES = ['lofi','deepsea','white','rainbow','dark','chaos'];
const CANVAS_THEMES = ['chaos','deepsea','lofi'];
const PEAK_BUCKETS = 4000;
const SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
const SPEAKER_BODY = '<path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>';
const ICON_SPEAKER = SVG_OPEN + SPEAKER_BODY + '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_MUTED = SVG_OPEN + SPEAKER_BODY + '<path d="M17 9l5 6M22 9l-5 6"/></svg>';

let ctx = null, mixBus = null;
let tracks = [];          // { id, name, buffer, gain, peaks, volume, muted, solo, src, els }
let duration = 0;         // longest track, in seconds
let selStart = null, selEnd = null;
let isLooping = false, isPlaying = false;
let speed = 1;
let playOffset = 0;       // audio position when playback started
let playStartCtx = 0;     // ctx.currentTime at that moment
let pausedAt = 0;
let nextId = 1;
let wakeLock = null;
let theme = 'lofi';

const $ = id => document.getElementById(id);
const tracksEl = $('tracks'), emptyHint = $('emptyHint'), statusMsg = $('statusMsg');
const addBtn = $('addBtn'), removeAllBtn = $('removeAllBtn'), fileInput = $('fileInput');
const restartBtn = $('restartBtn'), playBtn = $('playBtn'), loopBtn = $('loopBtn'), clearSelBtn = $('clearSelBtn');
const speedSlider = $('speedSlider'), speedValue = $('speedValue'), clock = $('clock');
const controls = $('controls'), dragHint = $('dragHint'), sectionLine = $('sectionLine'), wholeSongBtn = $('wholeSongBtn');
const startInput = $('startInput'), endInput = $('endInput');

/* ---------- small helpers ---------- */
function fmt(s) { if(isNaN(s) || s < 0) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function parseTime(str) { const p = String(str).trim().split(':'); if(p.length===2) return parseInt(p[0],10)*60+parseFloat(p[1]); return parseFloat(str)||0; }
function showStatus(text, type, autoHideMs) {
  statusMsg.textContent = text;
  statusMsg.className = 'status-msg visible ' + (type || 'info');
  if(autoHideMs) setTimeout(() => { if(statusMsg.textContent === text) hideStatus(); }, autoHideMs);
}
function hideStatus() { statusMsg.className = 'status-msg'; }
function hasSel() { return selStart !== null && selEnd !== null && selEnd - selStart > 0.05; }
function loopActive() { return isLooping && hasSel(); }

/* ---------- theme ---------- */
function setTheme(name) {
  if(THEMES.indexOf(name) === -1) name = 'lofi';
  theme = name;
  document.body.className = 'theme-' + name;
  if(CANVAS_THEMES.indexOf(name) !== -1) startScene(name); else stopScene();
  document.querySelectorAll('.theme-pick').forEach(b => b.classList.remove('active-theme'));
  const btn = document.querySelector('.tp-' + name);
  if(btn) btn.classList.add('active-theme');
  drawAll();
  saveSettings();
}

document.querySelector('.instructions .inline-icon').innerHTML = ICON_SPEAKER;

/* ---------- settings ---------- */
function saveSettings() {
  try {
    localStorage.setItem('choirMultitrack', JSON.stringify({ theme, speed, isLooping, selStart, selEnd }));
  } catch(e) {}
}
let savedSel = null;   // applied once the saved parts have loaded
function restoreSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('choirMultitrack') || '{}');
    if(typeof s.selStart === 'number' && typeof s.selEnd === 'number') savedSel = [s.selStart, s.selEnd];
    setTheme(s.theme && THEMES.indexOf(s.theme) !== -1 ? s.theme : 'lofi');
    if(s.speed) { speed = s.speed; speedSlider.value = speed; speedValue.textContent = speed.toFixed(2) + 'x'; }
    if(s.isLooping) { isLooping = true; loopBtn.textContent = 'Loop: On'; loopBtn.classList.add('active'); }
  } catch(e) { setTheme('lofi'); }
}

/* ---------- loading ---------- */
function ensureCtx() {
  // iPhone: play through the silent switch like a music app would
  try { if(navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e) {}
  if(!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    // every part -> mixBus -> analyser -> speakers
    mixBus = ctx.createGain();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;   // ~45 ms: long enough to smooth chords and vibrato
    freqData = new Uint8Array(analyser.fftSize);
    mixBus.connect(analyser);
    analyser.connect(ctx.destination);
  }
  if(ctx.state === 'suspended') ctx.resume();
  return ctx;
}

/* Older iPhones have no audioSession API. Web Audio follows the silent
   switch there, but a playing <audio> element does not, and while one is
   playing the whole page is treated as media. So loop a silent clip
   alongside playback. */
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let silentEl = null;
function silentWavUrl() {
  const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function startSilentKeeper() {
  if(!isIOS || navigator.audioSession) return;
  if(!silentEl) {
    silentEl = document.createElement('audio');
    silentEl.src = silentWavUrl();
    silentEl.loop = true;
    silentEl.setAttribute('playsinline', '');
    silentEl.setAttribute('x-webkit-airplay', 'deny');
  }
  silentEl.play().catch(() => {});
}
function stopSilentKeeper() { if(silentEl) silentEl.pause(); }

/* ---------- saved parts (stay on this device between visits) ----------
   Audio bytes live in IndexedDB; names, volume, mute and solo in localStorage. */
const DB_NAME = 'choirMultitrack', STORE = 'audio', META_KEY = 'choirMultitrackParts';
let dbPromise = null;
function openDB() {
  if(!dbPromise) dbPromise = new Promise((resolve, reject) => {
    if(!window.indexedDB) { reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
function dbDo(mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, mode);
    const req = fn(tx.objectStore(STORE));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = tx.onabort = () => reject(tx.error);
  }));
}
function storeAudio(id, bytes) {
  return dbDo('readwrite', s => s.put(bytes, id)).catch(() => {
    showStatus('This part will not be remembered: the device is out of storage space.', 'error', 6000);
  });
}
function deleteAudio(id) { return dbDo('readwrite', s => s.delete(id)).catch(() => {}); }
function clearAudio() { return dbDo('readwrite', s => s.clear()).catch(() => {}); }
function loadAudio(id) { return dbDo('readonly', s => s.get(id)); }

function saveParts() {
  try {
    localStorage.setItem(META_KEY, JSON.stringify(tracks.map(t =>
      ({ id: t.id, name: t.name, volume: t.volume, muted: t.muted, solo: t.solo }))));
  } catch(e) {}
}

async function restoreParts() {
  let meta = [];
  try { meta = JSON.parse(localStorage.getItem(META_KEY) || '[]'); } catch(e) {}
  if(!meta.length) return;
  showStatus('Loading your saved parts...', 'info');
  ensureCtx();
  let restored = 0;
  for(const m of meta) {
    try {
      const bytes = await loadAudio(m.id);
      if(!bytes) continue;
      const buffer = await ctx.decodeAudioData(bytes.slice(0));
      addTrack(m.name, buffer, m);
      restored++;
    } catch(e) {}
  }
  nextId = tracks.reduce((mx, t) => Math.max(mx, t.id + 1), nextId);
  saveParts();
  refreshDuration();
  if(savedSel && savedSel[1] <= duration) { selStart = savedSel[0]; selEnd = savedSel[1]; saveSettings(); }
  layoutAll();
  updateTimeInputs();
  if(restored) showStatus('Welcome back: ' + restored + ' part' + (restored > 1 ? 's' : '') + ' ready', 'info', 3000);
  else hideStatus();
}

addBtn.addEventListener('click', () => { ensureCtx(); fileInput.click(); });
emptyHint.addEventListener('click', () => addBtn.click());
fileInput.addEventListener('change', () => {
  if(fileInput.files && fileInput.files.length) addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

/* drop files anywhere on the page */
['dragover','drop'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('drop', e => {
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('audio') || /\.(mp3|m4a|wav|ogg|aac|flac|mp4|opus|wma)$/i.test(f.name));
  if(files.length) { ensureCtx(); addFiles(files); }
});

async function addFiles(files) {
  showStatus('Reading ' + files.length + ' file' + (files.length>1?'s':'') + '...', 'info');
  stopPlayback();
  let failed = [];
  for(const file of files) {
    try {
      const arr = await file.arrayBuffer();
      const keep = arr.slice(0);   // decodeAudioData empties the original
      const buffer = await ctx.decodeAudioData(arr);
      const tr = addTrack(file.name.replace(/\.[^.]+$/, ''), buffer);
      storeAudio(tr.id, keep);
    } catch(err) {
      failed.push(file.name);
    }
  }
  saveParts();
  refreshDuration();
  layoutAll();
  if(failed.length) showStatus('Could not read: ' + failed.join(', '), 'error', 8000);
  else showStatus(tracks.length + ' part' + (tracks.length>1?'s':'') + ' loaded', 'info', 2500);
}

function addTrack(name, buffer, saved) {
  const gain = ctx.createGain();
  gain.connect(mixBus);
  const s = saved || {};
  const tr = {
    id: s.id || nextId++, name, buffer, gain, src: null,
    peaks: computePeaks(buffer),
    volume: typeof s.volume === 'number' ? s.volume : 1,
    muted: !!s.muted, solo: !!s.solo, els: null
  };
  tracks.push(tr);
  buildTrackRow(tr);
  applyGains();
  return tr;
}

function computePeaks(buffer) {
  const chCount = buffer.numberOfChannels;
  const chans = [];
  for(let c = 0; c < chCount; c++) chans.push(buffer.getChannelData(c));
  const len = buffer.length;
  const peaks = new Float32Array(PEAK_BUCKETS * 2);
  for(let i = 0; i < PEAK_BUCKETS; i++) {
    const s = Math.floor(i * len / PEAK_BUCKETS);
    const e = Math.max(s + 1, Math.floor((i+1) * len / PEAK_BUCKETS));
    let mn = 0, mx = 0;
    for(let j = s; j < e && j < len; j++) {
      let v = 0;
      for(let c = 0; c < chCount; c++) v += chans[c][j];
      v /= chCount;
      if(v < mn) mn = v;
      if(v > mx) mx = v;
    }
    peaks[i*2] = mn; peaks[i*2+1] = mx;
  }
  return peaks;
}

function refreshDuration() {
  duration = tracks.reduce((m, t) => Math.max(m, t.realDuration || t.buffer.duration), 0);
  if(selEnd !== null && selEnd > duration) selEnd = duration;
  if(selStart !== null && selStart >= duration) { selStart = null; selEnd = null; }
  const has = tracks.length > 0;
  emptyHint.style.display = has ? 'none' : 'block';
  controls.className = has ? 'controls visible' : 'controls';
  updateSelectionUI();
  updateClock();
}

/* Pad shorter tracks with silence so a loop region longer than a track
   still keeps every track on the same clock. */
function padTracks() {
  const target = Math.ceil(duration * ctx.sampleRate);
  tracks.forEach(tr => {
    if(tr.buffer.length >= target - 1) return;
    const nb = ctx.createBuffer(tr.buffer.numberOfChannels, target, ctx.sampleRate);
    for(let c = 0; c < tr.buffer.numberOfChannels; c++) nb.copyToChannel(tr.buffer.getChannelData(c), c, 0);
    tr.realDuration = tr.realDuration || tr.buffer.duration;
    tr.buffer = nb;
  });
}

/* ---------- track rows ---------- */
function buildTrackRow(tr) {
  const row = document.createElement('div');
  row.className = 'track';
  row.innerHTML =
    '<div class="track-head">' +
      '<div class="track-name" title="Click to rename"></div>' +
      '<div class="track-btns">' +
        '<button class="mini mute" title="Mute" aria-label="Mute" aria-pressed="false">' + ICON_SPEAKER + '</button>' +
        '<button class="mini solo" title="Solo" aria-label="Solo" aria-pressed="false">S</button>' +
        '<input type="range" class="vol" min="0" max="1" step="0.01" value="' + tr.volume + '" title="Volume" aria-label="Volume">' +
        '<button class="mini kill" title="Remove">&#10005;</button>' +
      '</div>' +
    '</div>' +
    '<div class="track-wave"><canvas></canvas><div class="sel-overlay"></div><div class="ph"></div></div>';

  const nameEl = row.querySelector('.track-name');
  nameEl.textContent = tr.name;
  const muteBtn = row.querySelector('.mute');
  const soloBtn = row.querySelector('.solo');
  const volEl = row.querySelector('.vol');
  const killBtn = row.querySelector('.kill');
  const waveEl = row.querySelector('.track-wave');
  const canvas = row.querySelector('canvas');

  tr.els = { row, nameEl, muteBtn, soloBtn, volEl, waveEl, canvas,
             sel: row.querySelector('.sel-overlay'), ph: row.querySelector('.ph') };

  nameEl.addEventListener('click', () => {
    const v = prompt('Name this part', tr.name);
    if(v !== null && v.trim()) { tr.name = v.trim(); nameEl.textContent = tr.name; saveParts(); }
  });
  muteBtn.addEventListener('click', () => { tr.muted = !tr.muted; applyGains(); saveParts(); });
  soloBtn.addEventListener('click', () => { tr.solo = !tr.solo; applyGains(); saveParts(); });
  volEl.addEventListener('input', () => { tr.volume = parseFloat(volEl.value); applyGains(); });
  volEl.addEventListener('change', saveParts);
  killBtn.addEventListener('click', () => removeTrack(tr));
  attachDrag(waveEl);

  tracksEl.appendChild(row);
}

function removeTrack(tr) {
  const wasPlaying = isPlaying;
  const pos = currentPos();
  stopPlayback();
  try { tr.gain.disconnect(); } catch(e) {}
  tr.els.row.remove();
  tracks = tracks.filter(t => t !== tr);
  deleteAudio(tr.id);
  saveParts();
  refreshDuration();
  layoutAll();
  applyGains();
  if(wasPlaying && tracks.length) startPlayback(pos);
}

removeAllBtn.addEventListener('click', () => {
  if(!tracks.length) return;
  stopPlayback();
  tracks.forEach(t => { try { t.gain.disconnect(); } catch(e) {} t.els.row.remove(); });
  tracks = [];
  selStart = selEnd = null; pausedAt = 0;
  clearAudio();
  saveParts();
  saveSettings();
  refreshDuration();
  hideStatus();
});

function applyGains() {
  const anySolo = tracks.some(t => t.solo);
  tracks.forEach(tr => {
    const audible = !tr.muted && (!anySolo || tr.solo);
    const g = audible ? tr.volume : 0;
    if(ctx) tr.gain.gain.setTargetAtTime(g, ctx.currentTime, 0.01);
    else tr.gain.gain.value = g;
    tr.els.muteBtn.classList.toggle('on', tr.muted);
    tr.els.muteBtn.innerHTML = tr.muted ? ICON_MUTED : ICON_SPEAKER;
    tr.els.muteBtn.setAttribute('aria-pressed', tr.muted);
    tr.els.soloBtn.classList.toggle('on', tr.solo);
    tr.els.soloBtn.setAttribute('aria-pressed', tr.solo);
    tr.els.row.classList.toggle('dim', !audible);
  });
}

/* ---------- waveform drawing ---------- */
function layoutAll() {
  tracks.forEach(tr => {
    const c = tr.els.canvas;
    const dpr = window.devicePixelRatio || 1;
    const w = tr.els.waveEl.clientWidth, h = tr.els.waveEl.clientHeight;
    c.width = Math.max(1, Math.round(w * dpr));
    c.height = Math.max(1, Math.round(h * dpr));
  });
  drawAll();
  updateSelectionUI();
  updatePlayheads();
}

function drawAll() { tracks.forEach(drawTrack); }

function drawTrack(tr) {
  const c = tr.els.canvas, g = c.getContext('2d');
  const W = c.width, H = c.height, mid = H / 2;
  g.clearRect(0, 0, W, H);
  if(!duration) return;

  const col = WAVE_COLOR[theme] || '#fff';
  const trackDur = tr.realDuration || tr.buffer.duration;

  g.strokeStyle = col;
  g.globalAlpha = 0.35;
  g.beginPath(); g.moveTo(0, mid); g.lineTo(W, mid); g.stroke();
  g.globalAlpha = 1;

  g.fillStyle = col;
  for(let x = 0; x < W; x++) {
    const t = (x / W) * duration;
    if(t > trackDur) break;
    const b = Math.min(PEAK_BUCKETS - 1, Math.floor((t / trackDur) * PEAK_BUCKETS));
    const mn = tr.peaks[b*2], mx = tr.peaks[b*2+1];
    const y1 = mid - mx * mid * 0.92;
    const y2 = mid - mn * mid * 0.92;
    g.fillRect(x, y1, 1, Math.max(1, y2 - y1));
  }
}

/* ---------- selection ---------- */
let dragging = false, dragTrack = null, dragAnchor = 0, tapAt = 0, dragMoved = false, prevSel = [null, null];

function attachDrag(waveEl) {
  waveEl.addEventListener('pointerdown', e => {
    if(!duration) return;
    try { waveEl.setPointerCapture(e.pointerId); } catch(err) {}
    dragging = true; dragMoved = false; dragTrack = waveEl;
    prevSel = [selStart, selEnd];
    tapAt = xToTime(waveEl, e.clientX);
    // a tap right at the left edge means the very start
    if(e.clientX - waveEl.getBoundingClientRect().left < 14) tapAt = 0;
    const edge = edgeAt(waveEl, e);
    if(edge) {
      // grabbed an edge of the section: keep the other edge where it is
      dragAnchor = edge === 'start' ? selEnd : selStart;
      return;
    }
    dragAnchor = tapAt;   // the section only changes once the finger moves sideways
  });
  waveEl.addEventListener('pointermove', e => {
    if(!dragging) { waveEl.style.cursor = edgeAt(waveEl, e) ? 'ew-resize' : ''; return; }
    if(dragTrack !== waveEl) return;
    const t = xToTime(waveEl, e.clientX);
    if(Math.abs(t - tapAt) > 0.08) dragMoved = true;
    if(!dragMoved) return;
    selStart = Math.min(dragAnchor, t);
    selEnd = Math.max(dragAnchor, t);
    updateSelectionUI();
  });
  // the browser took the touch over to scroll the page: undo, don't jump
  waveEl.addEventListener('pointercancel', () => {
    if(!dragging) return;
    dragging = false;
    selStart = prevSel[0]; selEnd = prevSel[1];
    updateSelectionUI();
  });
  ['pointerup'].forEach(ev => waveEl.addEventListener(ev, () => {
    if(!dragging) return;
    dragging = false;
    if(!dragMoved) {
      // a tap, not a drag: jump there and keep whatever section was set
      selStart = prevSel[0]; selEnd = prevSel[1];
      updateSelectionUI();
      updateTimeInputs();
      seek(tapAt);
      return;
    }
    updateTimeInputs();
    saveSettings();
    if(isPlaying && loopActive()) startPlayback(selStart);
  }));
  waveEl.addEventListener('pointerleave', () => { if(!dragging) waveEl.style.cursor = ''; });
}

// which edge of the current section (if any) is under the pointer
function edgeAt(waveEl, e) {
  if(!hasSel()) return null;
  const r = waveEl.getBoundingClientRect();
  const grab = e.pointerType === 'touch' ? 22 : 10;
  const sx = r.left + selStart / duration * r.width;
  const ex = r.left + selEnd / duration * r.width;
  const ds = Math.abs(e.clientX - sx), de = Math.abs(e.clientX - ex);
  if(Math.min(ds, de) > grab) return null;
  return ds <= de ? 'start' : 'end';
}

function xToTime(waveEl, clientX) {
  const r = waveEl.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  return frac * duration;
}

function updateSelectionUI() {
  const show = hasSel();
  tracks.forEach(tr => {
    const el = tr.els.sel;
    if(!show) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = (selStart / duration * 100) + '%';
    el.style.width = ((selEnd - selStart) / duration * 100) + '%';
  });
  dragHint.classList.toggle('visible', tracks.length > 0 && !show);
  sectionLine.classList.toggle('has-sel', show);
  updateTimeInputs();
}

function updateTimeInputs() {
  if(sectionLine.classList.contains('editing') && !hasSel()) return;
  // leave a box alone while someone is typing in it
  if(document.activeElement !== startInput) startInput.value = hasSel() ? fmt(selStart) : '';
  if(document.activeElement !== endInput) endInput.value = hasSel() ? fmt(selEnd) : '';
}

// typed times apply as soon as both make sense; no Set button needed
function readTimeInputs() {
  if(!startInput.value.trim() || !endInput.value.trim()) return null;
  const s = parseTime(startInput.value), e = parseTime(endInput.value);
  if(isNaN(s) || isNaN(e) || e <= s || s < 0 || e > duration + 0.5) return null;
  return [s, Math.min(e, duration)];
}
function applyTimeInputs() {
  if(!duration) return;
  const r = readTimeInputs();
  [startInput, endInput].forEach(i => i.classList.toggle('invalid', !r));
  if(!r) return;
  selStart = r[0]; selEnd = r[1];
  sectionLine.classList.remove('editing');
  updateSelectionUI();
  saveSettings();
  if(isPlaying && loopActive()) startPlayback(selStart);
}
[startInput, endInput].forEach(inp => {
  inp.addEventListener('change', applyTimeInputs);
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
});
// leaving the boxes with times that don't work: put back what was there
sectionLine.addEventListener('focusout', () => setTimeout(() => {
  if(sectionLine.contains(document.activeElement)) return;
  if(startInput.classList.contains('invalid')) {
    sectionLine.classList.add('shake');
    setTimeout(() => sectionLine.classList.remove('shake'), 400);
  }
  [startInput, endInput].forEach(i => i.classList.remove('invalid'));
  sectionLine.classList.remove('editing');
  updateSelectionUI();
}, 0));
wholeSongBtn.addEventListener('click', () => {
  if(!duration) return;
  sectionLine.classList.add('editing');
  startInput.value = '0:00';
  endInput.value = fmt(duration);
  startInput.focus();
  startInput.select();
});

clearSelBtn.addEventListener('click', () => {
  selStart = selEnd = null;
  updateSelectionUI();
  updateTimeInputs();
  saveSettings();
});

/* ---------- transport ---------- */
function currentPos() {
  if(!isPlaying) return pausedAt;
  let t = playOffset + (ctx.currentTime - playStartCtx) * speed;
  if(loopActive()) {
    const a = selStart, b = selEnd, span = b - a;
    if(t > b) t = a + ((t - a) % span);
    if(t < a) t = a;
  }
  return Math.max(0, Math.min(t, duration));
}

function stopSources() {
  tracks.forEach(tr => {
    if(tr.src) { try { tr.src.onended = null; tr.src.stop(); } catch(e) {} tr.src = null; }
  });
}

function startPlayback(from) {
  if(!tracks.length) return;
  ensureCtx();
  padTracks();
  stopSources();

  const lp = loopActive();
  if(lp) {
    if(from < selStart || from >= selEnd) from = selStart;
  } else if(from >= duration - 0.02) {
    from = 0;
  }

  const when = ctx.currentTime + 0.08;
  tracks.forEach(tr => {
    const s = ctx.createBufferSource();
    s.buffer = tr.buffer;
    s.playbackRate.value = speed;
    s.connect(tr.gain);
    if(lp) { s.loop = true; s.loopStart = selStart; s.loopEnd = Math.min(selEnd, tr.buffer.duration); }
    s.start(when, Math.min(from, tr.buffer.duration - 0.001));
    tr.src = s;
  });

  playOffset = from;
  playStartCtx = when;
  isPlaying = true;
  playBtn.textContent = 'Pause';
  startSilentKeeper();
  acquireWakeLock();
}

function stopPlayback() {
  if(isPlaying) pausedAt = currentPos();
  stopSources();
  isPlaying = false;
  playBtn.textContent = 'Play';
  stopSilentKeeper();
  releaseWakeLock();
}

function seek(t) {
  const wasPlaying = isPlaying;
  pausedAt = Math.max(0, Math.min(t, duration));
  if(wasPlaying) startPlayback(pausedAt);
  else { stopSources(); updatePlayheads(); updateClock(); }
}

// back to the start of the section when looping, otherwise of the song
restartBtn.innerHTML = SVG_OPEN + '<path d="M6 5v14"/><path d="M19 5L9 12l10 7z" fill="currentColor"/></svg>';
restartBtn.addEventListener('click', () => {
  if(!tracks.length) return;
  seek(loopActive() ? selStart : 0);
});

playBtn.addEventListener('click', () => {
  if(!tracks.length) return;
  if(isPlaying) stopPlayback();
  else startPlayback(loopActive() ? Math.max(pausedAt, selStart) : pausedAt);
});

loopBtn.addEventListener('click', () => {
  isLooping = !isLooping;
  loopBtn.textContent = 'Loop: ' + (isLooping ? 'On' : 'Off');
  loopBtn.classList.toggle('active', isLooping);
  saveSettings();
  if(isPlaying) startPlayback(currentPos());
});

speedSlider.addEventListener('input', () => {
  const v = parseFloat(speedSlider.value);
  if(isPlaying) {
    const pos = currentPos();
    speed = v;
    playOffset = pos;
    playStartCtx = ctx.currentTime;
    tracks.forEach(tr => { if(tr.src) tr.src.playbackRate.value = v; });
  } else {
    speed = v;
  }
  speedValue.textContent = v.toFixed(2) + 'x';
  saveSettings();
});

/* ---------- playhead + clock ---------- */
function updatePlayheads() {
  const pos = currentPos();
  const show = tracks.length > 0;
  tracks.forEach(tr => {
    const el = tr.els.ph;
    if(!show || !duration) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = (pos / duration * 100) + '%';
  });
}

function updateClock() {
  clock.textContent = fmt(currentPos()) + ' / ' + fmt(duration);
}

function tick() {
  if(isPlaying) {
    if(!loopActive() && currentPos() >= duration - 0.02) {
      pausedAt = 0;
      stopPlayback();
    }
    updatePlayheads();
    updateClock();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- screen wake lock ---------- */
async function acquireWakeLock() {
  try { if('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
}
function releaseWakeLock() {
  if(wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && isPlaying) acquireWakeLock();
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  else if(e.key === 'Home' || e.key === '0') restartBtn.click();
  else if(e.key === 'l' || e.key === 'L') loopBtn.click();
});

/* ---------- resize ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { layoutAll(); restartScene(); }, 120);
});

restoreSettings();
refreshDuration();
restoreParts();

if('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
