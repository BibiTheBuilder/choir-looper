<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e6007e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Choir Looper</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
  }

  /* ===== THEMES ===== */
  body.theme-white { background: #f5f5f5; color: #111; }
  body.theme-dark { background: #0b0c10; color: #d9dce3; }
  /* Pride: the six flag colours as soft bands sized to the screen, so the
     whole rainbow always shows. A fixed layer covers any page length and
     drifts very slowly up and down. */
  body.theme-rainbow { background: #732982; color: #fff; }
  body.theme-rainbow::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg,
      #e40303 0%, #ff8c00 20%, #ffed00 40%, #008026 60%, #004dff 80%, #750787 100%);
    background-size: 100% 115%; animation: rainbowBg 30s ease-in-out infinite alternate;
  }
  body.theme-deepsea { background: linear-gradient(180deg, #02101e 0%, #04263b 100%); background-attachment: fixed; color: #bff4ee; }
  @keyframes rainbowBg { from { background-position: 50% 0%; } to { background-position: 50% 100%; } }

  body.theme-chaos { background: #1a0a2e; color: #fff; }
  /* Lofi Girl: warm dusk study room, rain on the window */
  body.theme-lofi { background: linear-gradient(180deg, #241b24 0%, #392a2c 55%, #4b3430 100%); background-attachment: fixed; color: #f3dcc4; }

  /* ===== ANIMATED BACKGROUND ===== */
  #sceneCanvas {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0; display: none;
  }
  body.theme-chaos #sceneCanvas,
  body.theme-deepsea #sceneCanvas,
  body.theme-lofi #sceneCanvas { display: block; }
  body.theme-chaos .main-content,
  body.theme-deepsea .main-content,
  body.theme-lofi .main-content { position: relative; z-index: 1; }

  .main-content { display: flex; flex-direction: column; align-items: center; width: 100%; }

  /* ===== TITLE ===== */
  h1 {
    font-family: 'Fredoka One', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Varela Round', 'Nunito', 'Trebuchet MS', sans-serif; font-size: 2.2rem; margin-bottom: 2px;
    text-transform: uppercase; letter-spacing: 3px; text-align: center;
  }
  .theme-white h1 { color: #111; }
  .theme-dark h1 { color: #e6e8ee; }
  .theme-rainbow h1 {
    background: linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0077ff, #8800ff);
    background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: rainbowText 12s linear infinite;
  }
  .theme-deepsea h1 { color: #4ff2e9; text-shadow: 0 0 18px rgba(79,242,233,0.55); }
  .theme-chaos h1 {
    background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff0066);
    background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: rainbowText 1.5s linear infinite;
  }
  .theme-lofi h1 { color: #f0b184; text-shadow: 0 2px 14px rgba(0,0,0,0.5); }
  @keyframes rainbowText { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

  .subtitle {
    font-size: 1.2rem; font-weight: 800; margin-bottom: 18px; text-align: center;
    padding: 8px 20px; border-radius: 6px; display: inline-block;
  }
  .theme-white .subtitle { background: rgba(0,0,0,0.07); color: #111; }
  .theme-dark .subtitle { background: rgba(255,255,255,0.06); color: #c9cdd6; }
  .theme-rainbow .subtitle { background: rgba(0,0,0,0.4); color: #fff; }
  .theme-deepsea .subtitle { background: rgba(79,242,233,0.1); color: #bff4ee; }
  .theme-chaos .subtitle { background: rgba(255,0,255,0.3); color: #0ff; }
  .theme-lofi .subtitle { background: rgba(0,0,0,0.3); color: #e9c9ab; }

  /* ===== BUTTONS ===== */
  .btn {
    border-radius: 8px; padding: 12px 22px; font-size: 1.1rem; font-weight: 800;
    cursor: pointer; transition: background 0.15s, transform 0.1s;
    border: 2px solid transparent; font-family: 'Nunito', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: scale(1.03); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }


  .theme-white .btn { background: #fff; color: #111; border-color: #999; }
  .theme-white .btn:hover { background: #eee; }
  .theme-white .btn.primary { background: #0066cc; color: #fff; border-color: #0066cc; }
  .theme-white .btn.active { background: #0066cc; color: #fff; }

  .theme-dark .btn { background: #171a21; color: #d9dce3; border-color: #343a46; }
  .theme-dark .btn:hover { background: #1f232c; }
  .theme-dark .btn.primary { background: #2f3d55; color: #e8ecf4; border-color: #4a5b78; }
  .theme-dark .btn.active { background: #8aa2c8; color: #0b0c10; border-color: #8aa2c8; }

  .theme-rainbow .btn { background: rgba(0,0,0,0.3); color: #fff; border-color: rgba(255,255,255,0.5); }
  .theme-rainbow .btn.primary {
    background: linear-gradient(90deg, #ff0055, #ff9900, #ffff00, #00cc44, #0088ff, #7700ff);
    background-size: 200% auto; animation: rainbowText 12s linear infinite;
    color: #fff; border-color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .theme-rainbow .btn.active { background: rgba(255,255,255,0.25); color: #fff; border-color: #fff; }

  .theme-deepsea .btn { background: rgba(255,255,255,0.07); color: #bff4ee; border-color: rgba(79,242,233,0.55); }
  .theme-deepsea .btn:hover { background: rgba(255,255,255,0.14); }
  .theme-deepsea .btn.primary { background: #0e7d74; color: #eafffc; border-color: #4ff2e9; box-shadow: 0 0 14px rgba(79,242,233,0.35); }
  .theme-deepsea .btn.active { background: #4ff2e9; color: #02222e; border-color: #4ff2e9; }

  .theme-chaos .btn { background: rgba(255,0,255,0.3); color: #0ff; border-color: #ff0; }
  .theme-chaos .btn:hover { background: rgba(255,0,255,0.5); }
  .theme-chaos .btn.primary { background: #ff0066; color: #fff; border-color: #ff0; }
  .theme-chaos .btn.active { background: #ff0; color: #000; border-color: #ff0; }

  .theme-lofi .btn { background: rgba(0,0,0,0.32); color: #f3dcc4; border-color: rgba(240,177,132,0.5); }
  .theme-lofi .btn:hover { background: rgba(0,0,0,0.45); }
  .theme-lofi .btn.primary { background: #e0955e; color: #2b1f1d; border-color: #f0b184; }
  .theme-lofi .btn.active { background: #c98fa0; color: #2b1f1d; border-color: #e6b3c0; }

  /* ===== TOP ROW ===== */
  .upload-row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  input[type="file"] { display: none; }

  .status-msg { display: none; max-width: 560px; text-align: center; font-weight: 800; font-size: 1rem; padding: 10px 16px; border-radius: 8px; margin-top: 10px; }
  .status-msg.visible { display: block; }
  .status-msg.error { background: #c0392b; color: #fff; }
  .status-msg.info { background: rgba(0,0,0,0.35); color: #fff; }
  .theme-white .status-msg.info { background: rgba(0,0,0,0.75); }
  @keyframes shakeX { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
  .shake { animation: shakeX 0.35s ease; }
  input.invalid { border-color: #ff3333 !important; }

  /* ===== TRACKS ===== */
  .tracks { width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .track {
    display: grid; grid-template-columns: 210px 1fr; gap: 12px; align-items: center;
    border-radius: 10px; padding: 8px 10px;
  }
  .theme-white .track { background: #e8e8e8; }
  .theme-dark .track { background: #12141a; border: 1px solid #1e222b; }
  .theme-rainbow .track { background: rgba(0,0,0,0.3); }
  .theme-deepsea .track { background: rgba(2,16,30,0.6); border: 1px solid rgba(79,242,233,0.22); }
  .theme-chaos .track { background: rgba(0,0,0,0.5); border: 1px solid #ff00ff; }
  .theme-lofi .track { background: rgba(0,0,0,0.3); border: 1px solid rgba(240,177,132,0.22); }

  .track.dim .track-wave { opacity: 0.3; }
  .track.dim .track-name { opacity: 0.55; }
  .track-head { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .track-name {
    font-weight: 800; font-size: 1rem; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: text;
  }
  .track-btns { display: flex; gap: 6px; align-items: center; }
  .mini {
    border-radius: 6px; border: 2px solid; background: transparent; color: inherit;
    font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem;
    padding: 4px 9px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .theme-white .mini { border-color: #888; }
  .theme-dark .mini { border-color: #343a46; }
  .theme-dark .mini.on { background: #a85a6c; border-color: #a85a6c; color: #f3eef0; }
  .theme-dark .mini.on.solo { background: #c9a85a; border-color: #c9a85a; color: #0b0c10; }
  .theme-rainbow .mini { border-color: rgba(255,255,255,0.6); }
  .theme-deepsea .mini { border-color: rgba(79,242,233,0.5); }
  .theme-chaos .mini { border-color: #ff0; }
  .theme-lofi .mini { border-color: rgba(240,177,132,0.5); }
  .mini.mute { display: inline-flex; align-items: center; justify-content: center; }
  .mini svg { width: 18px; height: 18px; display: block; }
  .mini.on { background: #ff3d68; color: #fff; border-color: #ff3d68; }
  .mini.on.solo { background: #ffcc00; color: #222; border-color: #ffcc00; }
  .vol { width: 88px; accent-color: currentColor; }

  .track-wave {
    position: relative; height: 72px; border-radius: 8px; overflow: hidden;
    /* vertical swipes scroll the page; sideways drags pick a section */
    cursor: crosshair; touch-action: pan-y; -webkit-user-select: none; user-select: none;
  }
  .theme-white .track-wave { background: #d5d5d5; }
  .theme-dark .track-wave { background: #0e1015; }
  .theme-dark input[type="range"] { accent-color: #8aa2c8; }
  .theme-rainbow .track-wave { background: rgba(0,0,0,0.35); }
  .theme-deepsea .track-wave { background: rgba(2,16,30,0.85); }
  .theme-chaos .track-wave { background: rgba(0,0,0,0.55); }
  .theme-lofi .track-wave { background: rgba(24,15,18,0.72); }
  .track-wave canvas { width: 100%; height: 100%; display: block; }

  .sel-overlay { position: absolute; top: 0; height: 100%; pointer-events: none; display: none; }
  /* grab handles on both edges of the section */
  .sel-overlay::before, .sel-overlay::after {
    content: ''; position: absolute; top: 50%; width: 8px; height: 26px; margin-top: -13px;
    border-radius: 4px; background: currentColor; box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
  }
  .sel-overlay::before { left: -5px; }
  .sel-overlay::after { right: -5px; }
  .theme-white .sel-overlay { color: #0066cc; background: rgba(0,100,200,0.2); border-left: 2px solid #0066cc; border-right: 2px solid #0066cc; }
  .theme-dark .sel-overlay { color: #8aa2c8; background: rgba(138,162,200,0.16); border-left: 2px solid #8aa2c8; border-right: 2px solid #8aa2c8; }
  .theme-rainbow .sel-overlay { color: #fff; background: rgba(255,255,255,0.2); border-left: 2px solid #fff; border-right: 2px solid #fff; }
  .theme-deepsea .sel-overlay { color: #4ff2e9; background: rgba(79,242,233,0.18); border-left: 2px solid #4ff2e9; border-right: 2px solid #4ff2e9; }
  .theme-chaos .sel-overlay { color: #0ff; background: rgba(255,0,255,0.3); border-left: 2px solid #0ff; border-right: 2px solid #0ff; }
  .theme-lofi .sel-overlay { color: #f0b184; background: rgba(240,177,132,0.2); border-left: 2px solid #f0b184; border-right: 2px solid #f0b184; }

  .ph { position: absolute; top: 0; height: 100%; width: 2px; pointer-events: none; display: none; }
  .theme-white .ph { background: #ff3333; }
  .theme-dark .ph { background: #e3c08d; }
  .theme-rainbow .ph { background: #fff; }
  .theme-deepsea .ph { background: #eafffc; box-shadow: 0 0 12px #4ff2e9; }
  .theme-chaos .ph { background: #ff0; }
  .theme-lofi .ph { background: #fff1e0; box-shadow: 0 0 10px rgba(240,177,132,0.8); }

  /* empty state doubles as a drop zone; tapping it opens the file picker */
  .empty-hint {
    display: block; width: 100%; text-align: center; font-family: 'Nunito', sans-serif;
    font-weight: 800; font-size: 1.05rem; line-height: 1.5; padding: 26px 18px;
    border-radius: 12px; border: 2px dashed; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .empty-hint strong { display: block; font-size: 1.25rem; margin-bottom: 4px; }
  .theme-white .empty-hint { background: #e8e8e8; color: #111; border-color: #999; }
  .theme-dark .empty-hint { background: #12141a; color: #d9dce3; border-color: #343a46; }
  .theme-rainbow .empty-hint { background: rgba(0,0,0,0.45); color: #fff; border-color: rgba(255,255,255,0.75); }
  .theme-deepsea .empty-hint { background: rgba(2,16,30,0.75); color: #bff4ee; border-color: rgba(79,242,233,0.5); }
  .theme-chaos .empty-hint { background: rgba(0,0,0,0.7); color: #fff; border-color: #ff00ff; }
  .theme-chaos .empty-hint strong { color: #ff0; }
  .theme-lofi .empty-hint { background: rgba(0,0,0,0.35); color: #f3dcc4; border-color: rgba(240,177,132,0.5); }
  .theme-lofi .empty-hint strong { color: #f0b184; }
  .theme-deepsea .empty-hint strong { color: #4ff2e9; }

  /* ===== HINTS + TIME INPUTS ===== */
  /* instruction above the waves; hides once a section is picked */
  .drag-hint {
    display: none; text-align: center; font-weight: 800; font-size: 1rem;
    padding: 6px 16px; border-radius: 20px; margin-top: 12px;
  }
  .drag-hint.visible { display: inline-block; }
  .theme-white .drag-hint { background: rgba(0,0,0,0.07); color: #111; }
  .theme-dark .drag-hint { background: rgba(255,255,255,0.06); color: #c9cdd6; }
  .theme-rainbow .drag-hint { background: rgba(0,0,0,0.5); color: #fff; }
  .theme-deepsea .drag-hint { background: rgba(2,16,30,0.75); color: #bff4ee; }
  .theme-chaos .drag-hint { background: rgba(0,0,0,0.7); color: #0ff; }
  .theme-lofi .drag-hint { background: rgba(0,0,0,0.4); color: #f3dcc4; }

  /* section readout in the transport: "Section 0:22 – 0:27 x" or "Whole song" */
  .section-line { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1rem; }
  .section-line .sec-label { opacity: 0.8; }
  .section-line .sec-times { display: none; align-items: center; gap: 6px; }
  .section-line.has-sel .sec-times, .section-line.editing .sec-times { display: inline-flex; }
  .section-line.has-sel .whole-song, .section-line.editing .whole-song { display: none; }
  .whole-song {
    background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 6px 2px;
    text-decoration: underline dotted; text-underline-offset: 4px; -webkit-tap-highlight-color: transparent;
  }
  .section-line input[type="text"] {
    width: 62px; height: 36px; padding: 0 4px; border-radius: 6px; border: 2px solid;
    font-size: 1rem; font-weight: 800; font-family: 'Nunito', sans-serif; text-align: center;
  }
  .section-line .mini { min-width: 36px; height: 36px; padding: 0; }
  .theme-white .section-line input { background: #fff; color: #111; border-color: #999; }
  .theme-dark .section-line input { background: #171a21; color: #e6e8ee; border-color: #343a46; }
  .theme-rainbow .section-line input { background: rgba(0,0,0,0.45); color: #fff; border-color: rgba(255,255,255,0.6); }
  .theme-deepsea .section-line input { background: rgba(2,16,30,0.85); color: #eafffc; border-color: rgba(79,242,233,0.55); }
  .theme-chaos .section-line input { background: rgba(0,0,0,0.7); color: #ff0; border-color: #ff00ff; }
  .theme-lofi .section-line input { background: rgba(24,15,18,0.85); color: #f3dcc4; border-color: rgba(240,177,132,0.5); }

  /* ===== CONTROLS ===== */
  .controls { display: none; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .controls.visible { display: flex; }
  .speed-control { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; font-weight: 800; }
  .speed-control input[type="range"] { width: 110px; accent-color: currentColor; }
  #restartBtn { display: inline-flex; align-items: center; justify-content: center; }
  #restartBtn svg { width: 22px; height: 22px; }
  .clock { font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }

  /* ===== INSTRUCTIONS + FOOTER ===== */
  .instructions {
    max-width: 560px; width: 100%; border-radius: 10px; padding: 18px 24px;
    font-size: 1.05rem; font-weight: 700; line-height: 1.9; text-align: center; margin-top: 18px;
  }
  .theme-white .instructions { background: #e0e0e0; color: #111; }
  .theme-dark .instructions { background: #12141a; color: #c9cdd6; border: 1px solid #1e222b; }
  .theme-rainbow .instructions { background: rgba(0,0,0,0.3); color: #fff; }
  .theme-deepsea .instructions { background: rgba(2,16,30,0.7); color: #bff4ee; border: 1px solid rgba(79,242,233,0.3); }
  .theme-chaos .instructions { background: rgba(0,0,0,0.55); color: #0ff; border: 1px solid #ff00ff; }
  .theme-lofi .instructions { background: rgba(0,0,0,0.32); color: #f3dcc4; border: 1px solid rgba(240,177,132,0.25); }
  .instructions ol { list-style: none; counter-reset: step; display: inline-block; text-align: left; line-height: 1.7; }
  .instructions li { counter-increment: step; }
  .instructions li::before { content: counter(step) '.'; display: inline-block; width: 1.4em; opacity: 0.6; }
  .instructions .inline-icon svg { width: 1.05em; height: 1.05em; vertical-align: -0.15em; }
  .instructions strong { font-size: 1.15rem; font-family: 'Fredoka One', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Varela Round', 'Nunito', 'Trebuchet MS', sans-serif; display: block; margin-bottom: 6px; }
  .theme-rainbow .instructions strong { color: #ffff00; }
  .theme-deepsea .instructions strong { color: #4ff2e9; }
  .theme-chaos .instructions strong { color: #ff0; }
  .theme-lofi .instructions strong { color: #f0b184; }

  .other-link { margin-top: 14px; font-weight: 800; font-size: 1rem; }
  .other-link a { color: inherit; }

  /* ===== THEME SWITCHER ===== */
  .theme-switcher { display: flex; gap: 8px; align-items: center; justify-content: center; margin: 0 0 14px; flex-wrap: wrap; max-width: 560px; }
  .theme-pick {
    padding: 8px 16px; border-radius: 20px; font-size: 0.95rem; font-weight: 800;
    cursor: pointer; border: 2px solid; font-family: 'Nunito', sans-serif; transition: transform 0.15s;
  }
  .theme-pick:hover { transform: scale(1.08); }
  .theme-pick.tp-white { background: #f5f5f5; color: #111; border-color: #999; }
  .theme-pick.tp-dark { background: #0b0c10; color: #d9dce3; border-color: #343a46; }
  .theme-pick.tp-rainbow {
    background: linear-gradient(90deg, #ff0000, #ff7700, #ffff00, #00ff00, #0077ff, #8800ff);
    color: #0b1d5e; border-color: #fff; text-shadow: 0 0 3px rgba(255,255,255,0.7);
  }
  .theme-pick.tp-deepsea {
    background: linear-gradient(180deg, #04263b, #02101e);
    color: #4ff2e9; border-color: #4ff2e9; text-shadow: 0 0 6px rgba(79,242,233,0.7);
  }
  .theme-pick.tp-chaos {
    background: linear-gradient(135deg, #ff00ff, #000, #00ffff);
    color: #ff0; border-color: #ff0; text-shadow: 0 0 6px #ff00ff;
    animation: chaosPickPulse 1s ease infinite alternate;
  }
  @keyframes chaosPickPulse { 0% { box-shadow: 0 0 4px #ff00ff; } 100% { box-shadow: 0 0 12px #00ffff; } }
  .theme-pick.tp-lofi {
    background: linear-gradient(135deg, #4b3430, #e0955e);
    color: #fff1e0; border-color: #f0b184; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .theme-pick.active-theme { outline: 3px solid #fff; outline-offset: 2px; }
  .theme-white .theme-pick.active-theme { outline-color: #111; }

  /* no sticky hover-zoom on touch screens */
  @media (hover: none) {
    .btn:hover, .theme-pick:hover { transform: none; }
  }

  /* ===== MOBILE ===== */
  @media (max-width: 700px) {
    body { padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); }
    h1 { font-size: 1.5rem; letter-spacing: 2px; }
    .subtitle { font-size: 0.95rem; margin-bottom: 12px; }
    .btn { padding: 12px 16px; font-size: 0.95rem; min-height: 46px; }

    /* name + buttons on top, the wave gets the full width underneath */
    .track { grid-template-columns: 1fr; gap: 6px; padding: 8px; }
    .track-head { flex-direction: row; align-items: center; gap: 8px; }
    .track-name { flex: 1; font-size: 0.95rem; }
    .track-btns { gap: 6px; flex-shrink: 0; }
    .mini { min-width: 40px; height: 40px; padding: 0 8px; font-size: 0.95rem; border-radius: 8px; }
    .vol { width: 64px; height: 40px; }
    .track-wave { height: 76px; }

    /* transport stays on screen while you scroll through the parts */
    .controls {
      position: sticky; bottom: 0; z-index: 5; width: calc(100% + 24px); margin: 14px -12px 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px;
      border-radius: 14px 14px 0 0; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.68); box-shadow: 0 -10px 28px rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.18);
    }
    /* soft fade above the bar: the parts look like they slide underneath it */
    .controls::before {
      content: ''; position: absolute; left: 0; right: 0; top: -28px; height: 28px; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.35));
    }
    .theme-white .controls { background: rgba(245,245,245,0.95); box-shadow: 0 -8px 24px rgba(0,0,0,0.18), 0 -1px 0 rgba(0,0,0,0.12); }
    .theme-white .controls::before { background: linear-gradient(to bottom, rgba(245,245,245,0), rgba(0,0,0,0.08)); }
    .controls #playBtn, .controls #loopBtn { flex: 1 1 35%; white-space: nowrap; }
    .controls #restartBtn { flex: 0 0 52px; padding: 0; }
    .speed-control { flex: 1 1 auto; }
    .drag-hint { font-size: 0.95rem; padding: 6px 14px; }
    .controls .section-line { order: 4; flex: 1 1 auto; font-size: 0.95rem; }
    .controls .clock { order: 5; font-size: 0.95rem; }
    .controls .speed-control { order: 6; flex: 1 1 100%; }
    .section-line input[type="text"] { width: 54px; font-size: 0.95rem; }
    .speed-control input[type="range"] { flex: 1; width: auto; min-width: 80px; }
    .theme-switcher { gap: 4px; }
    .theme-pick { padding: 5px 8px; font-size: 0.8rem; white-space: nowrap; }
  }
</style>
</head>
<body class="theme-lofi">

<canvas id="sceneCanvas"></canvas>

<div class="main-content">
<h1>Choir Looper</h1>
<p class="subtitle">Loop it. Nail it. Sing it. &#128522;</p>
<div class="theme-switcher" id="themeSwitcher">
  <button class="theme-pick tp-lofi active-theme" onclick="setTheme('lofi')">Lofi</button>
  <button class="theme-pick tp-deepsea" onclick="setTheme('deepsea')">Sea</button>
  <button class="theme-pick tp-white" onclick="setTheme('white')">White</button>
  <button class="theme-pick tp-rainbow" onclick="setTheme('rainbow')">Pride</button>
  <button class="theme-pick tp-dark" onclick="setTheme('dark')">Dark</button>
  <button class="theme-pick tp-chaos" onclick="setTheme('chaos')">Chaos</button>
</div>

<div class="upload-row">
  <button class="btn primary" id="addBtn">Add audio files</button>
  <button class="btn" id="removeAllBtn">Remove all</button>
  <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac,.mp4,.mpeg,.mpg,.wma,.opus">
</div>

<div class="status-msg" id="statusMsg" role="status" aria-live="polite"></div>

<div class="drag-hint" id="dragHint">Drag across a wave to pick a section</div>

<div class="tracks" id="tracks">
  <button type="button" class="empty-hint" id="emptyHint"><strong>No parts yet</strong>Add your soprano, mezzo, alto, tenor and bass files, or drop them here.</button>
</div>



<div class="controls" id="controls">
  <button class="btn" id="restartBtn" title="Back to the start" aria-label="Back to the start"></button>
  <button class="btn primary" id="playBtn">Play</button>
  <button class="btn" id="loopBtn">Loop: Off</button>
  <div class="section-line" id="sectionLine">
    <span class="sec-label">Section</span>
    <button class="whole-song" id="wholeSongBtn" title="Type a start and end time">Whole song</button>

      <input type="text" id="startInput" placeholder="0:00" aria-label="Section start" autocomplete="off">
      <span aria-hidden="true">&ndash;</span>
      <input type="text" id="endInput" placeholder="0:00" aria-label="Section end" autocomplete="off">

    <li>Add a file for each part</li>
    <li>Drag on a wave to pick a section</li>
